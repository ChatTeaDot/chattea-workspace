name: chattea

services:
  chattea-be:
    container_name: chattea-be
    build:
      context: ./chattea-be
    environment:
      NODE_ENV: production
      PORT: 4000
      SERVICE_NAME: chattea-be
      SERVICE_ENV: ${SERVICE_ENV:-development}
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      DATABASE_URL: postgres://chattea:${POSTGRES_PASSWORD:-chattea-dev}@postgres:5432/chattea
      PHONE_CODE_PEPPER: ${PHONE_CODE_PEPPER:-dev-only-pepper}
      SMS_PROVIDER: ${SMS_PROVIDER:-memory}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-dev-sender}
      MUNJANARA_ENDPOINT: ${MUNJANARA_ENDPOINT:-}
      MUNJANARA_USER_ID: ${MUNJANARA_USER_ID:-}
      MUNJANARA_API_KEY: ${MUNJANARA_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVELOPE_ENDPOINT: ${SENTRY_ENVELOPE_ENDPOINT:-}
      DATADOG_APM_ENABLED: ${DATADOG_APM_ENABLED:-false}
      DATADOG_LOG_ENDPOINT: ${DATADOG_LOG_ENDPOINT:-}
      DATADOG_API_KEY: ${DATADOG_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    container_name: chattea-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chattea
      POSTGRES_USER: chattea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chattea-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chattea -d chattea"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
