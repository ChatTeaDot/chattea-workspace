name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "release target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - mobile-build

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/chatteadot/chattea-be

jobs:
  backend-deploy:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'backend')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: chattea
          POSTGRES_USER: chattea
          POSTGRES_PASSWORD: chattea-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chattea -d chattea"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: chattea-be
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.CHATTEA_SUBMODULE_TOKEN }}
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1
          package_json_file: chattea-be/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: chattea-be/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:all
      - run: pnpm run lint:check
      - run: pnpm run format:check
      - run: pnpm test --runInBand
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Run PostgreSQL tests
        run: |
          pnpm run migrate
          pnpm run test:e2e --runInBand
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USERNAME: chattea
          POSTGRES_PASSWORD: chattea-dev
          POSTGRES_DATABASE: chattea
          JWT_ACCESS_TOKEN_SECRET: test-access-secret
          JWT_REFRESH_TOKEN_SECRET: test-refresh-secret
          JWT_ACCESS_TOKEN_EXP: 15m
          JWT_REFRESH_TOKEN_EXP: 30d
          SIGNUP_TOKEN_SECRET: test-signup-secret
          KAKAO_SIGNUP_TOKEN_SECRET: test-kakao-signup-secret
          PHONE_CODE_PEPPER: test-pepper
          CLIENT_URL: http://localhost:8081
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build and push immutable backend image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./chattea-be
          file: ./chattea-be/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release
      - name: Validate immutable backend digest
        id: image
        working-directory: .
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build output is not an immutable SHA-256 digest."
            exit 1
          fi
          echo "digest=${BUILD_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
      - name: Verify registry provenance and SBOM
        working-directory: .
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json (index .SBOM "linux/amd64").SPDX}}' | jq -e '.SPDXID == "SPDXRef-DOCUMENT"'
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json (index .SBOM "linux/arm64").SPDX}}' | jq -e '.SPDXID == "SPDXRef-DOCUMENT"'
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json (index .Provenance "linux/amd64").SLSA}}' | jq -e '.buildType and .builder'
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json (index .Provenance "linux/arm64").SLSA}}' | jq -e '.buildType and .builder'
      - name: Scan amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
      - name: Scan arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
      - name: Create GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Keylessly sign and verify image
        working-directory: .
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign verify "$IMAGE_REF" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Smoke exact release digest
        working-directory: .
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bash .github/scripts/smoke-backend-image.sh "$IMAGE_DIGEST"
      - name: Deploy exact release digest
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASE_WORKSPACE_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
          RELEASE_WORKSPACE_SHA: ${{ github.sha }}
          RELEASE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_GHCR_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          RELEASE_GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          fingerprint: ${{ secrets.HOSTINGER_HOST_FINGERPRINT }}
          command_timeout: 30m
          envs: RELEASE_WORKSPACE_DIR,RELEASE_WORKSPACE_SHA,RELEASE_IMAGE_DIGEST,RELEASE_GHCR_USERNAME,RELEASE_GHCR_TOKEN
          script_path: .github/scripts/deploy-backend.sh

  mobile-build:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'all' || inputs.target == 'mobile-build')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    defaults:
      run:
        working-directory: chattea-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.CHATTEA_SUBMODULE_TOKEN }}
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.4
          package_json_file: chattea-fe/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: chattea-fe/pnpm-lock.yaml
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 22.4.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: eas build --platform all --profile production --non-interactive
